! MPLS Foundations; IOS XR 7.11 ASR9000 syntax reference.
! Documentation reviewed; router execution pending.
! Complete baseline from a clean node: PHP, sync enabled; no optional faults.
configure
hostname P2
interface Loopback0
 description OSPF and LDP identity
 ipv4 address 10.10.0.3/32
 no shutdown
 exit
interface GigabitEthernet0/0/0/0
 description P2 to PE1; OSPF cost 40
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.10.13.1/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 description P2 to P1; OSPF cost 10
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.10.23.1/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/2
 description P2 to PE2; OSPF cost 10
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.10.34.0/31
 no shutdown
 exit
router ospf CORE
 router-id 10.10.0.3
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 40
   exit
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   exit
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
   exit
  exit
 exit
mpls ldp
 router-id 10.10.0.3
 address-family ipv4
  discovery transport-address 10.10.0.3
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 interface GigabitEthernet0/0/0/1
  address-family ipv4
   exit
  exit
 interface GigabitEthernet0/0/0/2
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
router ospf CORE
 mpls ldp sync
 exit
commit
end
