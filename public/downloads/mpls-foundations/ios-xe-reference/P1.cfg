! IOS XE17.x router-family reference. Check platform/license/MPLS feature support.
! A separate all-XE alternative; do not paste into IOS XR.
enable
configure terminal
hostname P1
ip cef
mpls ip
mpls label protocol ldp
interface Loopback0
 ip address 10.10.0.2 255.255.255.255
 ip ospf 1 area 0
 ip ospf cost 1
 exit
interface GigabitEthernet1
 description P1 to PE1; cost 10
 mtu 1586
 ip mtu 1500
 ip address 10.10.12.1 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
 no shutdown
 exit
interface GigabitEthernet2
 description P1 to P2; cost 10
 mtu 1586
 ip mtu 1500
 ip address 10.10.23.0 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
 no shutdown
 exit
interface GigabitEthernet3
 description P1 to PE2; cost 40
 mtu 1586
 ip mtu 1500
 ip address 10.10.24.0 255.255.255.254
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 40
 mpls ip
 no shutdown
 exit
router ospf 1
 router-id 10.10.0.2
 passive-interface Loopback0
 mpls ldp sync
 exit
mpls ldp router-id Loopback0 force
end
! Save only after validation: copy running-config startup-config
