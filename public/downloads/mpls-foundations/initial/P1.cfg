 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 description P1 to P2; OSPF cost 10
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.10.23.0/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/2
 description P1 to PE2; OSPF cost 40
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.10.24.0/31
 no shutdown
 exit
commit
end
