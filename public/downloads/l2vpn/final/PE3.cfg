! IOS XR 7.11 ASR 9000 syntax reference; L2VPN lab.
! Source reviewed 2026-11-27; device/emulator execution pending.
! Complete clean baseline; one L2VPN hierarchy.
configure
hostname PE3
interface Loopback0
 ipv4 address 10.20.0.5/32
 no shutdown
 exit
interface GigabitEthernet0/0/0/0
 description PE3 to P2
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.20.35.1/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 description Customer tagged trunk to CE3
 mtu 1514
 no shutdown
 exit
router ospf CORE
 router-id 10.20.0.5
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   exit
  exit
 exit
mpls ldp
 router-id 10.20.0.5
 address-family ipv4
  discovery transport-address 10.20.0.5
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
interface GigabitEthernet0/0/0/1.200 l2transport
 description VPLS service 200 to CE3
 encapsulation dot1q 200
 rewrite ingress tag pop 1 symmetric
 no shutdown
 exit
l2vpn
 pw-class L2-CW
  encapsulation mpls
   protocol ldp
   control-word
   transport-mode ethernet
   exit
  exit
 bridge group VPLS
  bridge-domain LAN200
   interface GigabitEthernet0/0/0/1.200
    exit
   vfi MESH200
    neighbor 10.20.0.1 pw-id 200
     pw-class L2-CW
     exit
    neighbor 10.20.0.4 pw-id 200
     pw-class L2-CW
     exit
    exit
   exit
  exit
 exit
commit
end
