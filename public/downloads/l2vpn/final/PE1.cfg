! IOS XR 7.11 ASR 9000 syntax reference; L2VPN lab.
! Source reviewed 2026-11-27; device/emulator execution pending.
! Complete clean baseline; one L2VPN hierarchy.
configure
hostname PE1
interface Loopback0
 ipv4 address 10.20.0.1/32
 no shutdown
 exit
interface GigabitEthernet0/0/0/0
 description PE1 to P1
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.20.12.0/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 description Customer tagged trunk to CE1
 mtu 1514
 no shutdown
 exit
router ospf CORE
 router-id 10.20.0.1
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   exit
  exit
 exit
mpls ldp
 router-id 10.20.0.1
 address-family ipv4
  discovery transport-address 10.20.0.1
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
interface GigabitEthernet0/0/0/1.100 l2transport
 description VPWS service 100 to CE1
 encapsulation dot1q 100
 rewrite ingress tag pop 1 symmetric
 no shutdown
 exit
interface GigabitEthernet0/0/0/1.200 l2transport
 description VPLS service 200 to CE1
 encapsulation dot1q 200
 rewrite ingress tag pop 1 symmetric
 no shutdown
 exit
l2vpn
 pw-class L2-CW
  encapsulation mpls
   protocol ldp
   control-word
   transport-mode ethernet
   exit
  exit
 xconnect group VPWS
  p2p CE1-CE2
   interface GigabitEthernet0/0/0/1.100
   neighbor ipv4 10.20.0.4 pw-id 100
    pw-class L2-CW
    exit
   exit
  exit
 bridge group VPLS
  bridge-domain LAN200
   interface GigabitEthernet0/0/0/1.200
    exit
   vfi MESH200
    neighbor 10.20.0.4 pw-id 200
     pw-class L2-CW
     exit
    neighbor 10.20.0.5 pw-id 200
     pw-class L2-CW
     exit
    exit
   exit
  exit
 exit
commit
end
