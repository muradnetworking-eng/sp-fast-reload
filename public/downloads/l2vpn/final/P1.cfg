! IOS XR 7.11 ASR 9000 syntax reference; L2VPN lab.
! Source reviewed 2026-11-27; device/emulator execution pending.
! Complete clean baseline; one L2VPN hierarchy.
configure
hostname P1
interface Loopback0
 ipv4 address 10.20.0.2/32
 no shutdown
 exit
interface GigabitEthernet0/0/0/0
 description P1 to PE1
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.20.12.1/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 description P1 to P2
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.20.23.0/31
 no shutdown
 exit
router ospf CORE
 router-id 10.20.0.2
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   exit
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   exit
  exit
 exit
mpls ldp
 router-id 10.20.0.2
 address-family ipv4
  discovery transport-address 10.20.0.2
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 interface GigabitEthernet0/0/0/1
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
commit
end
