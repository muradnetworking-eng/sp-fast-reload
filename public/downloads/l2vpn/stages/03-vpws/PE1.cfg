! IOS XR 7.11 ASR 9000 syntax reference; L2VPN lab.
! Source reviewed 2026-11-27; device/emulator execution pending.
configure
l2vpn
 pw-class L2-CW
  encapsulation mpls
   protocol ldp
   control-word
   transport-mode ethernet
   exit
  exit
 xconnect group VPWS
  p2p CE1-CE2
   interface GigabitEthernet0/0/0/1.100
   neighbor ipv4 10.20.0.4 pw-id 100
    pw-class L2-CW
    exit
   exit
  exit
 exit
commit
end
