configure
hostname P1
interface Loopback0
 ipv4 address 10.0.0.2 255.255.255.255
 ipv6 address 2001:db8:0::2/128
 exit
interface GigabitEthernet0/0/0/0
 mtu 1600
 ipv4 address 10.0.12.1 255.255.255.254
 ipv6 address 2001:db8:12::1/127
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 mtu 1600
 ipv4 address 10.0.23.0 255.255.255.254
 ipv6 address 2001:db8:23::0/127
 no shutdown
 exit
interface GigabitEthernet0/0/0/2
 mtu 1600
 ipv4 address 10.0.24.0 255.255.255.254
 ipv6 address 2001:db8:24::0/127
 no shutdown
 exit
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 address-family ipv4 unicast
  metric-style wide
  exit
 address-family ipv6 unicast
  exit
 interface Loopback0
  passive
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  exit
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
   metric 10
   exit
  address-family ipv6 unicast
   metric 10
   exit
  exit
 interface GigabitEthernet0/0/0/1
  point-to-point
  address-family ipv4 unicast
   metric 10
   exit
  address-family ipv6 unicast
   metric 10
   exit
  exit
 interface GigabitEthernet0/0/0/2
  point-to-point
  address-family ipv4 unicast
   metric 10
   exit
  address-family ipv6 unicast
   metric 10
   exit
  exit
 exit
mpls ldp
 router-id 10.0.0.2
 address-family ipv4
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 interface GigabitEthernet0/0/0/1
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
router bgp 65000
 bgp router-id 10.0.0.2
 address-family ipv4 unicast
  exit
 address-family ipv6 unicast
  exit
 neighbor 10.0.0.4
  remote-as 65000
  update-source Loopback0
  address-family ipv4 unicast
   exit
  exit
 neighbor 2001:db8:0::4
  remote-as 65000
  update-source Loopback0
  address-family ipv6 unicast
   exit
  exit
 exit
commit
end
