configure
hostname RR1
interface Loopback0
 ipv4 address 10.0.0.4 255.255.255.255
 ipv6 address 2001:db8:0::4/128
 exit
interface GigabitEthernet0/0/0/0
 mtu 1600
 ipv4 address 10.0.24.1 255.255.255.254
 ipv6 address 2001:db8:24::1/127
 no shutdown
 exit
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0004.00
 address-family ipv4 unicast
  metric-style wide
  exit
 address-family ipv6 unicast
  exit
 interface Loopback0
  passive
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  exit
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
   metric 10
   exit
  address-family ipv6 unicast
   metric 10
   exit
  exit
 exit
router bgp 65000
 bgp router-id 10.0.0.4
 address-family ipv4 unicast
  exit
 address-family ipv6 unicast
  exit
 neighbor 10.0.0.1
  remote-as 65000
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client
   exit
  exit
 neighbor 2001:db8:0::1
  remote-as 65000
  update-source Loopback0
  address-family ipv6 unicast
   route-reflector-client
   exit
  exit
 neighbor 10.0.0.2
  remote-as 65000
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client
   exit
  exit
 neighbor 2001:db8:0::2
  remote-as 65000
  update-source Loopback0
  address-family ipv6 unicast
   route-reflector-client
   exit
  exit
 neighbor 10.0.0.3
  remote-as 65000
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client
   exit
  exit
 neighbor 2001:db8:0::3
  remote-as 65000
  update-source Loopback0
  address-family ipv6 unicast
   route-reflector-client
   exit
  exit
 exit
commit
end
