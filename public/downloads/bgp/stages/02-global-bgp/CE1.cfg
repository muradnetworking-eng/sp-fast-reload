configure terminal
ip prefix-list CE1-V4-OUT seq 10 permit 192.0.2.11/32
ip prefix-list CE1-V4-IN seq 10 permit 198.51.100.22/32
ipv6 prefix-list CE1-V6-OUT seq 10 permit 2001:db8:101:100::11/128
ipv6 prefix-list CE1-V6-IN seq 10 permit 2001:db8:102:100::22/128
router bgp 65101
 bgp router-id 192.0.2.11
 no bgp default ipv4-unicast
 neighbor 172.16.101.1 remote-as 65000
 neighbor 2001:db8:101:1::1 remote-as 65000
 address-family ipv4 unicast
  network 192.0.2.11 mask 255.255.255.255
  neighbor 172.16.101.1 activate
  neighbor 172.16.101.1 prefix-list CE1-V4-OUT out
  neighbor 172.16.101.1 prefix-list CE1-V4-IN in
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:101:100::11/128
  neighbor 2001:db8:101:1::1 activate
  neighbor 2001:db8:101:1::1 prefix-list CE1-V6-OUT out
  neighbor 2001:db8:101:1::1 prefix-list CE1-V6-IN in
 exit-address-family
 exit
end
