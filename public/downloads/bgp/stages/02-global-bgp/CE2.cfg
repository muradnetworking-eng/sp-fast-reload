configure terminal
ip prefix-list CE2-V4-OUT seq 10 permit 198.51.100.22/32
ip prefix-list CE2-V4-IN seq 10 permit 192.0.2.11/32
ipv6 prefix-list CE2-V6-OUT seq 10 permit 2001:db8:102:100::22/128
ipv6 prefix-list CE2-V6-IN seq 10 permit 2001:db8:101:100::11/128
router bgp 65102
 bgp router-id 198.51.100.22
 no bgp default ipv4-unicast
 neighbor 172.16.102.1 remote-as 65000
 neighbor 2001:db8:102:1::1 remote-as 65000
 address-family ipv4 unicast
  network 198.51.100.22 mask 255.255.255.255
  neighbor 172.16.102.1 activate
  neighbor 172.16.102.1 prefix-list CE2-V4-OUT out
  neighbor 172.16.102.1 prefix-list CE2-V4-IN in
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:102:100::22/128
  neighbor 2001:db8:102:1::1 activate
  neighbor 2001:db8:102:1::1 prefix-list CE2-V6-OUT out
  neighbor 2001:db8:102:1::1 prefix-list CE2-V6-IN in
 exit-address-family
 exit
end
