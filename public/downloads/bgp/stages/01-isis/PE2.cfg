configure
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
 address-family ipv4 unicast
  metric-style wide
  exit
 address-family ipv6 unicast
  exit
 interface Loopback0
  passive
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  exit
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
   metric 10
   exit
  address-family ipv6 unicast
   metric 10
   exit
  exit
 exit
commit
end
