configure
vrf CORAL
 address-family ipv4 unicast
  import route-target 65000:100
  export route-target 65000:100
  exit
 address-family ipv6 unicast
  import route-target 65000:100
  export route-target 65000:100
  exit
 exit
hostname PE2
interface Loopback0
 ipv4 address 10.0.0.3 255.255.255.255
 ipv6 address 2001:db8:0::3/128
 exit
interface GigabitEthernet0/0/0/0
 mtu 1600
 ipv4 address 10.0.23.1 255.255.255.254
 ipv6 address 2001:db8:23::1/127
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 vrf CORAL
 ipv4 address 172.16.102.1 255.255.255.252
 ipv6 address 2001:db8:102:1::1/64
 no shutdown
 exit
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
 address-family ipv4 unicast
  metric-style wide
  exit
 address-family ipv6 unicast
  exit
 interface Loopback0
  passive
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  exit
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
   metric 10
   exit
  address-family ipv6 unicast
   metric 10
   exit
  exit
 exit
mpls ldp
 router-id 10.0.0.3
 address-family ipv4
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
prefix-set SITE1-V4
 192.0.2.11/32
end-set
prefix-set SITE1-V6
 2001:db8:101:100::11/128
end-set
prefix-set SITE2-V4
 198.51.100.22/32
end-set
prefix-set SITE2-V6
 2001:db8:102:100::22/128
end-set
route-policy CE2-IN-V4
 if destination in SITE2-V4 then
  pass
 else
  drop
 endif
end-policy
route-policy CE2-OUT-V4
 if destination in SITE1-V4 then
  pass
 else
  drop
 endif
end-policy
route-policy CE2-IN-V6
 if destination in SITE2-V6 then
  pass
 else
  drop
 endif
end-policy
route-policy CE2-OUT-V6
 if destination in SITE1-V6 then
  pass
 else
  drop
 endif
end-policy
router bgp 65000
 bgp router-id 10.0.0.3
 address-family vpnv4 unicast
  exit
 address-family vpnv6 unicast
  exit
 neighbor 10.0.0.4
  remote-as 65000
  update-source Loopback0
  address-family vpnv4 unicast
   exit
  address-family vpnv6 unicast
   exit
  exit
 vrf CORAL
  rd 65000:102
  bgp router-id 10.0.0.3
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  neighbor 172.16.102.2
   remote-as 65102
   address-family ipv4 unicast
    route-policy CE2-IN-V4 in
    route-policy CE2-OUT-V4 out
    exit
   exit
  neighbor 2001:db8:102:1::2
   remote-as 65102
   address-family ipv6 unicast
    route-policy CE2-IN-V6 in
    route-policy CE2-OUT-V6 out
    exit
   exit
  exit
 exit
commit
end
