configure
route-policy CE1-BACKUP-IN-V4
 if destination in SITE1-V4 then
  set local-preference 80
  pass
 else
  drop
 endif
end-policy
route-policy CE1-BACKUP-OUT-V4
 if destination in SITE2-V4 then
  set med 150
  pass
 else
  drop
 endif
end-policy
route-policy CE1-BACKUP-IN-V6
 if destination in SITE1-V6 then
  set local-preference 80
  pass
 else
  drop
 endif
end-policy
route-policy CE1-BACKUP-OUT-V6
 if destination in SITE2-V6 then
  set med 150
  pass
 else
  drop
 endif
end-policy
interface GigabitEthernet0/0/0/2
 ipv4 address 172.16.111.1 255.255.255.252
 ipv6 address 2001:db8:111:1::1/64
 no shutdown
 exit
router bgp 65000
 neighbor 172.16.111.2
  remote-as 65101
  address-family ipv4 unicast
   route-policy CE1-BACKUP-IN-V4 in
   route-policy CE1-BACKUP-OUT-V4 out
   exit
  exit
 neighbor 2001:db8:111:1::2
  remote-as 65101
  address-family ipv6 unicast
   route-policy CE1-BACKUP-IN-V6 in
   route-policy CE1-BACKUP-OUT-V6 out
   exit
  exit
 exit
commit
end
