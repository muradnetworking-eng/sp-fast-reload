configure terminal
interface GigabitEthernet2
 ip address 172.16.111.2 255.255.255.252
 ipv6 address 2001:db8:111:1::2/64
 no shutdown
 exit
router bgp 65101
 neighbor 172.16.111.1 remote-as 65000
 neighbor 2001:db8:111:1::1 remote-as 65000
 address-family ipv4 unicast
  neighbor 172.16.111.1 activate
  neighbor 172.16.111.1 prefix-list CE1-V4-OUT out
  neighbor 172.16.111.1 prefix-list CE1-V4-IN in
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:111:1::1 activate
  neighbor 2001:db8:111:1::1 prefix-list CE1-V6-OUT out
  neighbor 2001:db8:111:1::1 prefix-list CE1-V6-IN in
 exit-address-family
 exit
end
