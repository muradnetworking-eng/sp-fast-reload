! MPLS L3VPN complete clean baseline; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
configure
vrf ACME
 address-family ipv4 unicast
  import route-target 65000:100
  export route-target 65000:100
  exit
 address-family ipv6 unicast
  import route-target 65000:100
  export route-target 65000:100
  exit
 exit
vrf BETA
 address-family ipv4 unicast
  import route-target 65000:200
  export route-target 65000:200
  exit
 address-family ipv6 unicast
  import route-target 65000:200
  export route-target 65000:200
  exit
 exit
hostname PE1
interface Loopback0
 description Provider identity
 ipv4 address 10.0.0.1/32
 no shutdown
 exit
interface GigabitEthernet0/0/0/0
 description PE1 to P1
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.0.12.0/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 vrf ACME
 ipv4 address 172.16.11.0/31
 ipv6 address 2001:db8:11::/127
 no shutdown
 exit
interface GigabitEthernet0/0/0/2
 vrf BETA
 ipv4 address 172.16.11.0/31
 ipv6 address 2001:db8:11::/127
 no shutdown
 exit
router ospf CORE
 router-id 10.0.0.1
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   exit
  exit
 exit
mpls ldp
 router-id 10.0.0.1
 address-family ipv4
  discovery transport-address 10.0.0.1
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
prefix-set SITE1-V4
 10.60.1.1/32
end-set
prefix-set SITE1-V6
 2001:db8:60:1::1/128
end-set
prefix-set SITE2-V4
 10.60.2.2/32
end-set
prefix-set SITE2-V6
 2001:db8:60:2::2/128
end-set
route-policy VPN-S1-IN4
 if destination in SITE1-V4 then
  pass
 else
  drop
 endif
end-policy
route-policy VPN-S1-OUT4
 if destination in SITE2-V4 then
  pass
 else
  drop
 endif
end-policy
route-policy VPN-S1-IN6
 if destination in SITE1-V6 then
  pass
 else
  drop
 endif
end-policy
route-policy VPN-S1-OUT6
 if destination in SITE2-V6 then
  pass
 else
  drop
 endif
end-policy
route-policy DROP-ALL
 drop
end-policy
router bgp 65000
 bgp router-id 10.0.0.1
 address-family vpnv4 unicast
  exit
 address-family vpnv6 unicast
  exit
 neighbor 10.0.0.5
  remote-as 65000
  update-source Loopback0
  address-family vpnv4 unicast
   exit
  address-family vpnv6 unicast
   exit
  exit
 vrf ACME
  rd 65000:101
  bgp router-id 10.0.0.1
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  neighbor 172.16.11.1
   remote-as 65011
   address-family ipv4 unicast
    route-policy VPN-S1-IN4 in
    route-policy VPN-S1-OUT4 out
    exit
   exit
  neighbor 2001:db8:11::1
   remote-as 65011
   address-family ipv6 unicast
    route-policy VPN-S1-IN6 in
    route-policy VPN-S1-OUT6 out
    exit
   exit
  exit
 vrf BETA
  rd 65000:201
  bgp router-id 10.0.0.1
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  neighbor 172.16.11.1
   remote-as 65021
   address-family ipv4 unicast
    route-policy VPN-S1-IN4 in
    route-policy VPN-S1-OUT4 out
    exit
   exit
  neighbor 2001:db8:11::1
   remote-as 65021
   address-family ipv6 unicast
    route-policy VPN-S1-IN6 in
    route-policy VPN-S1-OUT6 out
    exit
   exit
  exit
 exit
commit
end
