! MPLS L3VPN; IOS XE17 C8000V reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
enable
configure terminal
hostname CE-B1
ip cef
ipv6 unicast-routing
interface Loopback0
 description Tenant site host routes
 ip address 10.60.1.1 255.255.255.255
 ipv6 address 2001:db8:60:1::1/128
 no shutdown
 exit
interface GigabitEthernet1
 description BETA to PE1
