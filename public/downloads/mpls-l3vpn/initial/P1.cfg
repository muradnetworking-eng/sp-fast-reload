! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Initial only; CE ports remain unaddressed until their VRF exists.
configure
hostname P1
interface Loopback0
 description Provider identity
 ipv4 address 10.0.0.2/32
 no shutdown
 exit
interface GigabitEthernet0/0/0/0
 description P1 to PE1
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.0.12.1/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/1
 description P1 to P2
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.0.23.0/31
 no shutdown
 exit
interface GigabitEthernet0/0/0/2
 description P1 to RR1
 mtu 1600
 ipv4 mtu 1500
 ipv4 address 10.0.25.0/31
 no shutdown
 exit
commit
end
