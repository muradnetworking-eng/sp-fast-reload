! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Create VRFs before assigning overlapping customer addresses.
configure
vrf ACME
 address-family ipv4 unicast
  import route-target 65000:100
  export route-target 65000:100
  exit
 address-family ipv6 unicast
  import route-target 65000:100
  export route-target 65000:100
  exit
 exit
vrf BETA
 address-family ipv4 unicast
  import route-target 65000:200
  export route-target 65000:200
  exit
 address-family ipv6 unicast
  import route-target 65000:200
  export route-target 65000:200
  exit
 exit
interface GigabitEthernet0/0/0/1
 vrf ACME
 ipv4 address 172.16.11.0/31
 ipv6 address 2001:db8:11::/127
 no shutdown
 exit
interface GigabitEthernet0/0/0/2
 vrf BETA
 ipv4 address 172.16.11.0/31
 ipv6 address 2001:db8:11::/127
 no shutdown
 exit
commit
end
