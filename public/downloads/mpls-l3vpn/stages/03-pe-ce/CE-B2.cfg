! MPLS L3VPN; IOS XE17 C8000V reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Only Loopback0 host routes originate.
enable
configure terminal
ip prefix-list SITE-LOCAL4 seq 10 permit 10.60.2.2/32
ip prefix-list SITE-REMOTE4 seq 10 permit 10.60.1.1/32
ipv6 prefix-list SITE-LOCAL6 seq 10 permit 2001:db8:60:2::2/128
ipv6 prefix-list SITE-REMOTE6 seq 10 permit 2001:db8:60:1::1/128
route-map CE-IN4 permit 10
 match ip address prefix-list SITE-REMOTE4
 exit
route-map CE-OUT4 permit 10
 match ip address prefix-list SITE-LOCAL4
 exit
route-map CE-IN6 permit 10
 match ipv6 address prefix-list SITE-REMOTE6
 exit
route-map CE-OUT6 permit 10
 match ipv6 address prefix-list SITE-LOCAL6
 exit
router bgp 65022
 bgp router-id 192.0.2.22
 no bgp default ipv4-unicast
 neighbor 172.16.22.0 remote-as 65000
 neighbor 2001:db8:22:: remote-as 65000
 address-family ipv4 unicast
  network 10.60.2.2 mask 255.255.255.255
  neighbor 172.16.22.0 activate
  neighbor 172.16.22.0 route-map CE-IN4 in
  neighbor 172.16.22.0 route-map CE-OUT4 out
  exit-address-family
 address-family ipv6 unicast
  network 2001:db8:60:2::2/128
  neighbor 2001:db8:22:: activate
  neighbor 2001:db8:22:: route-map CE-IN6 in
  neighbor 2001:db8:22:: route-map CE-OUT6 out
  exit-address-family
 exit
end
