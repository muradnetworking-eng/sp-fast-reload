! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Strict PE-CE IPv4 and IPv6 host-prefix policies.
configure
prefix-set SITE1-V4
 10.60.1.1/32
end-set
prefix-set SITE1-V6
 2001:db8:60:1::1/128
end-set
prefix-set SITE2-V4
 10.60.2.2/32
end-set
prefix-set SITE2-V6
 2001:db8:60:2::2/128
end-set
route-policy VPN-S1-IN4
 if destination in SITE1-V4 then
  pass
 else
  drop
 endif
end-policy
route-policy VPN-S1-OUT4
 if destination in SITE2-V4 then
  pass
 else
  drop
 endif
end-policy
route-policy VPN-S1-IN6
 if destination in SITE1-V6 then
  pass
 else
  drop
 endif
end-policy
route-policy VPN-S1-OUT6
 if destination in SITE2-V6 then
  pass
 else
  drop
 endif
end-policy
route-policy DROP-ALL
 drop
end-policy
router bgp 65000
 bgp router-id 10.0.0.1
 vrf ACME
  rd 65000:101
  bgp router-id 10.0.0.1
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  neighbor 172.16.11.1
   remote-as 65011
   address-family ipv4 unicast
    route-policy VPN-S1-IN4 in
    route-policy VPN-S1-OUT4 out
    exit
   exit
  neighbor 2001:db8:11::1
   remote-as 65011
   address-family ipv6 unicast
    route-policy VPN-S1-IN6 in
    route-policy VPN-S1-OUT6 out
    exit
   exit
  exit
 vrf BETA
  rd 65000:201
  bgp router-id 10.0.0.1
  address-family ipv4 unicast
   exit
  address-family ipv6 unicast
   exit
  neighbor 172.16.11.1
   remote-as 65021
   address-family ipv4 unicast
    route-policy VPN-S1-IN4 in
    route-policy VPN-S1-OUT4 out
    exit
   exit
  neighbor 2001:db8:11::1
   remote-as 65021
   address-family ipv6 unicast
    route-policy VPN-S1-IN6 in
    route-policy VPN-S1-OUT6 out
    exit
   exit
  exit
 exit
commit
end
