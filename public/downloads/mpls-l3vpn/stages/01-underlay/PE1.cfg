! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! OSPF everywhere; LDP only on three data-chain links.
configure
router ospf CORE
 router-id 10.0.0.1
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   exit
  exit
 exit
mpls ldp
 router-id 10.0.0.1
 address-family ipv4
  discovery transport-address 10.0.0.1
  exit
 interface GigabitEthernet0/0/0/0
  address-family ipv4
   exit
  exit
 exit
mpls oam
 exit
commit
end
