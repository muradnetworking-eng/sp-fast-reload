! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! OSPF everywhere; LDP only on three data-chain links.
configure
router ospf CORE
 router-id 10.0.0.5
 area 0
  interface Loopback0
   passive enable
   cost 1
   exit
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   exit
  exit
 exit
commit
end
