! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Add VPNv6 over the same IPv4 loopback session.
configure
router bgp 65000
 bgp router-id 10.0.0.5
 address-family vpnv6 unicast
  retain route-target all
  exit
 neighbor 10.0.0.1
  remote-as 65000
  update-source Loopback0
  address-family vpnv6 unicast
   route-reflector-client
   exit
  exit
 neighbor 10.0.0.4
  remote-as 65000
  update-source Loopback0
  address-family vpnv6 unicast
   route-reflector-client
   exit
  exit
 exit
commit
end
