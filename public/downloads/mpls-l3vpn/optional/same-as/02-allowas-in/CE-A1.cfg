! IOS XE17 C8000V isolated same-AS experiment; bounded to one own-AS occurrence.
! Documentation reviewed; device execution pending.
enable
configure terminal
router bgp 65011
 address-family ipv4 unicast
  neighbor 172.16.11.0 allowas-in 1
  exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:11:: allowas-in 1
  exit-address-family
 exit
end
