! MPLS L3VPN; IOS XE17 C8000V reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Lab-only replacement of the CE-A2 BGP process; baseline prefix policies remain.
enable
configure terminal
no router bgp 65012
router bgp 65011
 bgp router-id 192.0.2.12
 no bgp default ipv4-unicast
 neighbor 172.16.22.0 remote-as 65000
 neighbor 2001:db8:22:: remote-as 65000
 address-family ipv4 unicast
  network 10.60.2.2 mask 255.255.255.255
  neighbor 172.16.22.0 activate
  neighbor 172.16.22.0 route-map CE-IN4 in
  neighbor 172.16.22.0 route-map CE-OUT4 out
  exit-address-family
 address-family ipv6 unicast
  network 2001:db8:60:2::2/128
  neighbor 2001:db8:22:: activate
  neighbor 2001:db8:22:: route-map CE-IN6 in
  neighbor 2001:db8:22:: route-map CE-OUT6 out
  exit-address-family
 exit
end
