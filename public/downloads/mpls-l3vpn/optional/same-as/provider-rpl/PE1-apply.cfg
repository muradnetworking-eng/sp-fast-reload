! IOS XR7.11 ASR9000 reference; targeted RPL alternative for isolated same-AS lab.
! Source-reviewed only; observe PE advertisement and CE path before claiming recovery.
configure
route-policy SAME-AS-S1-OUT4
 if destination in SITE2-V4 then
  replace as-path '65011'
  pass
 else
  drop
 endif
end-policy
route-policy SAME-AS-S1-OUT6
 if destination in SITE2-V6 then
  replace as-path '65011'
  pass
 else
  drop
 endif
end-policy
router bgp 65000
 vrf ACME
  neighbor 172.16.11.1
   address-family ipv4 unicast
    route-policy SAME-AS-S1-OUT4 out
    exit
   exit
  exit
 exit
router bgp 65000
 vrf ACME
  neighbor 2001:db8:11::1
   address-family ipv6 unicast
    route-policy SAME-AS-S1-OUT6 out
    exit
   exit
  exit
 exit
commit
end
