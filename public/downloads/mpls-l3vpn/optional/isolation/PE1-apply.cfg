! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Only ACME policy attachment is changed; BETA stays baseline.
configure
prefix-set ACME-TEST-V4
 198.51.100.222/32
end-set
route-policy ACME-TEST-OUT4
 if destination in SITE2-V4 or destination in ACME-TEST-V4 then
  pass
 else
  drop
 endif
end-policy
prefix-set ACME-TEST-V6
 2001:db8:ac:2::222/128
end-set
route-policy ACME-TEST-OUT6
 if destination in SITE2-V6 or destination in ACME-TEST-V6 then
  pass
 else
  drop
 endif
end-policy
router bgp 65000
 vrf ACME
  neighbor 172.16.11.1
   address-family ipv4 unicast
    route-policy ACME-TEST-OUT4 out
    exit
   exit
  exit
 exit
router bgp 65000
 vrf ACME
  neighbor 2001:db8:11::1
   address-family ipv6 unicast
    route-policy ACME-TEST-OUT6 out
    exit
   exit
  exit
 exit
commit
end
