! MPLS L3VPN; IOS XR7.11 ASR9000 syntax reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
configure
router bgp 65000
 vrf ACME
  neighbor 172.16.22.1
   address-family ipv4 unicast
    route-policy VPN-S2-IN4 in
    exit
   exit
  exit
 exit
no route-policy ACME-TEST-IN4
no prefix-set ACME-TEST-V4
router bgp 65000
 vrf ACME
  neighbor 2001:db8:22::1
   address-family ipv6 unicast
    route-policy VPN-S2-IN6 in
    exit
   exit
  exit
 exit
no route-policy ACME-TEST-IN6
no prefix-set ACME-TEST-V6
commit
end
