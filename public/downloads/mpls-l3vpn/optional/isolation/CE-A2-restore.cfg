! MPLS L3VPN; IOS XE17 C8000V reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
enable
configure terminal
router bgp 65012
 address-family ipv4 unicast
  no network 198.51.100.222 mask 255.255.255.255
  exit-address-family
 address-family ipv6 unicast
  no network 2001:db8:ac:2::222/128
  exit-address-family
 exit
no ip prefix-list SITE-LOCAL4 seq 20
no ipv6 prefix-list SITE-LOCAL6 seq 20
no interface Loopback99
end
