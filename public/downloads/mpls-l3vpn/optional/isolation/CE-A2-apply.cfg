! MPLS L3VPN; IOS XE17 C8000V reference.
! Documentation reviewed2026-11-27; device/emulator execution pending.
! Apply only from baseline ASN65012; do not combine with same-AS experiment.
enable
configure terminal
interface Loopback99
 description ACME-only isolation marker
 ip address 198.51.100.222 255.255.255.255
 ipv6 address 2001:db8:ac:2::222/128
 no shutdown
 exit
ip prefix-list SITE-LOCAL4 seq 20 permit 198.51.100.222/32
ipv6 prefix-list SITE-LOCAL6 seq 20 permit 2001:db8:ac:2::222/128
router bgp 65012
 address-family ipv4 unicast
  network 198.51.100.222 mask 255.255.255.255
  exit-address-family
 address-family ipv6 unicast
  network 2001:db8:ac:2::222/128
  exit-address-family
 exit
end
